  # ═══════════════════════════════════════════════════════════════
  # SYNTHESIS + REPORT
  # ═══════════════════════════════════════════════════════════════

  - id: summarize
    bash: |
      echo "=== BOT FLEET TEST SUMMARY ==="
      echo ""

      TOTAL_PASSED=0
      TOTAL_FAILED=0
      BOTS_PASS=0
      BOTS_FAIL=0
      BOTS_SKIP=0

      for NODE_OUTPUT in "$test-gulf.output" "$test-giovanni.output" "$test-boxette.output" "$test-automenu.output" "$test-atlas.output" "$test-sharon.output"; do
        BOT=$(echo "$NODE_OUTPUT" | grep "^BOT=" | cut -d= -f2)
        STATUS=$(echo "$NODE_OUTPUT" | grep "^STATUS=" | cut -d= -f2)
        PASSED=$(echo "$NODE_OUTPUT" | grep "^PASSED=" | cut -d= -f2)
        FAILED=$(echo "$NODE_OUTPUT" | grep "^FAILED=" | cut -d= -f2)

        if [ "$STATUS" = "PASS" ]; then
          echo "  $BOT: $PASSED passed | PASS"
          TOTAL_PASSED=$((TOTAL_PASSED + PASSED))
          BOTS_PASS=$((BOTS_PASS + 1))
        elif [ "$STATUS" = "FAIL" ]; then
          echo "  $BOT: $PASSED passed, $FAILED FAILED | FAIL"
          TOTAL_PASSED=$((TOTAL_PASSED + PASSED))
          TOTAL_FAILED=$((TOTAL_FAILED + FAILED))
          BOTS_FAIL=$((BOTS_FAIL + 1))
        else
          echo "  $BOT: SKIPPED"
          BOTS_SKIP=$((BOTS_SKIP + 1))
        fi
      done

      TOTAL_TESTS=$((TOTAL_PASSED + TOTAL_FAILED))
      echo ""
      echo "TOTAL_TESTS=$TOTAL_TESTS"
      echo "TOTAL_PASSED=$TOTAL_PASSED"
      echo "TOTAL_FAILED=$TOTAL_FAILED"
      echo "BOTS_PASS=$BOTS_PASS"
      echo "BOTS_FAIL=$BOTS_FAIL"
      echo "BOTS_SKIP=$BOTS_SKIP"

      if [ "$TOTAL_FAILED" -gt 0 ]; then
        echo "FLEET_STATUS=FAIL"
      else
        echo "FLEET_STATUS=PASS"
      fi
    depends_on: [test-gulf, test-giovanni, test-boxette, test-automenu, test-atlas, test-sharon]
    timeout: 15000

  - id: report
    bash: |
      echo "=== SENDING TEST REPORT ==="

      TOTAL=$(echo "$summarize.output" | grep "^TOTAL_TESTS=" | cut -d= -f2)
      PASSED=$(echo "$summarize.output" | grep "^TOTAL_PASSED=" | cut -d= -f2)
      FAILED=$(echo "$summarize.output" | grep "^TOTAL_FAILED=" | cut -d= -f2)
      STATUS=$(echo "$summarize.output" | grep "^FLEET_STATUS=" | cut -d= -f2)

      if [ "$STATUS" = "PASS" ]; then
        EMOJI="✅"
      else
        EMOJI="❌"
      fi

      TEXT="$EMOJI *Bot Fleet Tests*

      Total: $TOTAL | Passed: $PASSED | Failed: $FAILED
      Status: *$STATUS*

      _Archon aion-bot-tests workflow_"

      curl -s -X POST "https://api.telegram.org/bot8531024055/sendMessage" \
        -d "chat_id=1490354101" \
        -d "parse_mode=Markdown" \
        --data-urlencode "text=$TEXT" > /dev/null

      echo "Report sent."
      echo ""
      echo "$summarize.output"
    depends_on: [summarize]
    timeout: 15000
