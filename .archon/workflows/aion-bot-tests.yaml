name: aion-bot-tests
description: |
  Use when: Running all bot test suites in parallel for quick fleet validation.
  Triggers: "run all bot tests", "test the fleet", "bot tests", "pre-deploy tests",
            "are the bots healthy", "vitest all bots".
  NOT for: Full platform audit (use aion-audit), single-repo deploys (use aion-deploy).

  Runs vitest on all 6 bots in parallel (Gulf, Giovanni, Boxette, AutoMenu, Atlas, Sharon).
  Pure bash — no AI, no mutations, just test execution.
  AI synthesis at the end scores fleet health.
  Telegram report with total pass/fail.

  Safety: 100% read-only. Tests use in-memory SQLite. No production impact.

provider: claude
model: haiku

nodes:
  # ═══════════════════════════════════════════════════════════════
  # 6 PARALLEL TEST RUNNERS
  # ═══════════════════════════════════════════════════════════════

  - id: test-gulf
    bash: |
      echo "=== GULF AGENT TESTS ==="
      cd /root/gulf-agent
      if [ -f "vitest.config.js" ] || [ -f "vitest.config.ts" ]; then
        OUTPUT=$(npx vitest run --reporter=verbose 2>&1)
        echo "$OUTPUT" | tail -20
        PASSED=$(echo "$OUTPUT" | grep -oP '\d+(?= passed)' | head -1)
        FAILED=$(echo "$OUTPUT" | grep -oP '\d+(?= failed)' | head -1)
        PASSED=${PASSED:-0}
        FAILED=${FAILED:-0}
        TOTAL=$((PASSED + FAILED))
        echo ""
        echo "BOT=gulf"
        echo "PASSED=$PASSED"
        echo "FAILED=$FAILED"
        echo "TOTAL=$TOTAL"
        if [ "$FAILED" -gt 0 ]; then
          echo "STATUS=FAIL"
          exit 1
        else
          echo "STATUS=PASS"
        fi
      else
        echo "BOT=gulf"
        echo "STATUS=SKIP (no vitest config)"
      fi
    timeout: 120000

